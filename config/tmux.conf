# Agent 工作台（ws）專用設定：tmux -L agents -f 這個檔
# 一格＝一個工作。格子變數：@task 名稱、@light wait/done、@msg 它最後說的、@ask 你最後問的、@age 等了多久

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -g extended-keys on
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g @max_panes 8
set -g @sidebar_width 20
# 分頁燈號要靠這個找格子，不能繼承開伺服器那個分頁的
set-environment -gu GNOME_TERMINAL_SCREEN

set -g set-titles on
set -g set-titles-string "Agent 工作台"

# ---- 每格上方的名牌：編號、燈號、名稱、等了多久、它最後說的 ----
set -g pane-border-status top
set -g pane-border-lines heavy
# 外框也亮燈（像 cmux 的提醒框）：等你＝紅框、做完＝綠框
set -g pane-border-style "#{?#{==:#{@light},wait},fg=colour196,#{?#{==:#{@light},done},fg=colour46,fg=colour240}}"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-format "#{?#{==:#{@role},sidebar},#[fg=colour45]#[bold] 工作列表 #[nobold]#[fg=colour244]F7 收起 ,#{?pane_in_mode,#[bg=colour31]#[fg=colour231]#[bold] ⤓ 跳到最底下（點這裡） #[default] ,}#{?pane_active,#[fg=colour45]#[bold]▶,#[fg=colour244] }#{@slot} #{?#{==:#{@light},wait},#[bg=colour160]#[fg=colour231]#[bold] 🔴 等你 #{@age} #[default],}#{?#{==:#{@light},done},#[bg=colour28]#[fg=colour231]#[bold] 🟢 做完 #{@age} #[default],}#[bold]#{?pane_active,#[fg=colour231],#[fg=colour252]} #{?#{@task},#{=/24/…:@task},(未命名・F2 取名)} #[nobold]#[fg=colour244]│ #{?#{@light},#{=/70/…:@msg},#{?#{@ask},你問：#{=/70/…:@ask},#{=/50/…:pane_title}}} }"

# ---- 最下面一列：所有工作一覽（單格模式時就是切換列）----
set -g status on
set -g status-interval 2
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 400
set -g status-right-length 80
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
set -g status-left "#{P:#{?#{==:#{@role},sidebar},,#{?pane_active,#[bg=colour31]#[fg=colour231]#[bold],#{?#{==:#{@light},wait},#[bg=colour160]#[fg=colour231],#{?#{==:#{@light},done},#[bg=colour28]#[fg=colour231],#[bg=colour237]#[fg=colour250]}}} #{@slot} #{?#{==:#{@light},wait},🔴,#{?#{==:#{@light},done},🟢,}}#{?#{@task},#{=/12/…:@task},未命名} #[default] }}"
set -g status-right "#[fg=colour244]#{?window_zoomed_flag,單格,格狀} │ F2命名 F3總覽 F4切模式 F5新增 F6下個亮燈 F7側欄 F8清空 │ %H:%M"

# ---- 快捷鍵（不用先按前綴）----
# Ctrl+Z 會把 Claude 整個暫停（看起來像壞掉），工作台裡停用；要復原輸入用 Ctrl+_
bind -n C-z display -d 2500 "工作台停用了 Ctrl+Z（會把 agent 暫停）。要復原輸入請用 Ctrl+_"
# ---- Ctrl+C／Ctrl+V 不用加 Shift ----
# Ctrl+C：有反白 → 複製；沒反白 → 照舊是「中斷」。Ctrl+V：文字直接貼；圖片照舊交給 Claude 貼圖
set -s copy-command "~/.local/bin/ws-clip copy"
# 捲動不顯示右上角的行數和時間（-H）；捲回最底下自動離開（-e）（使用者 2026-10-14）
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -e -H"
bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -M -H"
# 拖曳反白放開就複製並離開，不會停在捲動模式
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/ws-clip copy"
# 點名牌上的「⤓ 跳到最底下」回到輸入
bind -n MouseDown1Border if -F "#{pane_in_mode}" "send -X -t = cancel" "select-pane -t ="
bind -n C-c if -F "#{&&:#{pane_in_mode},#{selection_present}}" "send -X copy-pipe-and-cancel '~/.local/bin/ws-clip copy'" "run -b '~/.local/bin/ws-clip ctrl-c #{pane_id}'"
bind -n C-v run -b "~/.local/bin/ws-clip paste #{pane_id}"
bind -n F2 command-prompt -I "#{@task}" -p "這格的工作名稱：" "set -p @task '%%'"
bind -n F3 display-popup -E -w 92% -h 85% -T " 所有工作 " "~/.local/bin/ws pick"
bind -n F4 run -b "~/.local/bin/ws mode"
bind -n F5 command-prompt -p "新工作名稱：" "run -b \"~/.local/bin/ws new '%%'\""
bind -n F6 run -b "~/.local/bin/agent-light jump"
bind -n F7 run -b "~/.local/bin/ws side"
bind -n F8 confirm-before -p "清空第 #{@slot} 格「#{@task}」？格子會留著變空格 (y/n)" "run -b \"~/.local/bin/ws clear #{pane_id}\""
bind -n M-1 run -b "~/.local/bin/ws go 1"
bind -n M-2 run -b "~/.local/bin/ws go 2"
bind -n M-3 run -b "~/.local/bin/ws go 3"
bind -n M-4 run -b "~/.local/bin/ws go 4"
bind -n M-5 run -b "~/.local/bin/ws go 5"
bind -n M-6 run -b "~/.local/bin/ws go 6"
bind -n M-7 run -b "~/.local/bin/ws go 7"
bind -n M-8 run -b "~/.local/bin/ws go 8"
bind -n M-9 run -b "~/.local/bin/ws go 9"

# 切換格子 → 立刻叫側邊欄重畫
set-hook -g after-select-pane "run -b 'kill -USR1 #{@sidebar_pid} 2>/dev/null; true'"
set-hook -g pane-focus-in "run -b 'kill -USR1 #{@sidebar_pid} 2>/dev/null; true'"
set-hook -g pane-exited "run -b ~/.local/bin/ws-grid"
set-hook -g client-resized "run -b ~/.local/bin/ws-grid"
